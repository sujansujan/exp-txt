name: Build exp-txt Release APK

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Compile & Sign exp-txt Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Pre-installed Android SDK & Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name "sdkmanager" -type f | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            echo "Found sdkmanager at: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${KEY_ALIAS}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore "$KEYSTORE_PATH" \
              -alias plaintextfiles \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=exp-txt, OU=Mobile, O=PlainText, L=Kathmandu, S=Bagmati, C=NP"
            echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=plaintextfiles" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK
        run: |
          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          elif [ -f "exp-txt/settings.gradle.kts" ]; then
            PROJECT_DIR="exp-txt"
          else
            FOUND_SETTINGS=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
            PROJECT_DIR=$(dirname "$FOUND_SETTINGS")
          fi
          echo "Building Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleRelease --stacktrace --no-daemon
          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          mkdir -p "$GITHUB_WORKSPACE/release-output"
          cp "$APK_SOURCE" "$GITHUB_WORKSPACE/release-output/exp-txt-v1.0.0-release.apk"
          ls -lh "$GITHUB_WORKSPACE/release-output/exp-txt-v1.0.0-release.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exp-txt-Release-APK
          path: release-output/exp-txt-v1.0.0-release.apk
          if-no-files-found: error
          retention-days: 30
